[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    # Owner: maintainers. Expires: 2026-11-21. `paste` is a transitive build-time
    # dependency of the Candle adapter; no compatible safe replacement is available.
    # Remove this exception when the adapter graph no longer resolves to `paste`.
    { id = "RUSTSEC-2024-0436", reason = "Maintainer-approved, time-bounded transitive dependency exception; tracked for removal by 2026-11-21." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
