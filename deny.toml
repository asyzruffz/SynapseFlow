[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    # `paste` is a compile-time proc macro, not code linked into SynapseFlow
    # binaries. Candle 0.11.0 -> gemm 0.19.0 currently requires it, and
    # RUSTSEC reports no safe replacement release. Remove this exception when
    # the reviewed Candle/gemm dependency graph no longer includes `paste`.
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained build-time proc macro via candle-core 0.11.0 -> gemm 0.19.0; no safe upstream update is available." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
