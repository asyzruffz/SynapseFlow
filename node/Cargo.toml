[package]
name = "synapseflow-node"
version.workspace = true
edition.workspace = true
description = "Local node application boundary for SynapseFlow generation requests"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
cli = ["dep:clap"]
runtime = [
    "dep:synapseflow-adapter-in-memory",
    "dep:synapseflow-adapter-llama-cpp",
    "dep:synapseflow-adapter-local-cache",
]
http = ["dep:axum", "dep:serde", "dep:tokio", "dep:tokio-stream"]

[dependencies]
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
synapseflow-application = { path = "../application", version = "=0.2.0-dev" }
synapseflow-adapter-in-memory = { path = "../adapters/in-memory", version = "=0.2.0-dev", optional = true }
synapseflow-adapter-llama-cpp = { path = "../adapters/llama-cpp", version = "=0.2.0-dev", optional = true, features = ["runtime"] }
synapseflow-adapter-local-cache = { path = "../adapters/local-cache", version = "=0.2.0-dev", optional = true }
synapseflow-domain = { path = "../domain", version = "=0.2.0-dev" }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
synapseflow-adapter-in-memory = { path = "../adapters/in-memory", version = "=0.2.0-dev" }
tower.workspace = true

[[bin]]
name = "synapseflow-node"
path = "src/main.rs"
required-features = ["cli", "http", "runtime"]
