[workspace]
resolver = "2"
members = [
    "core",
    "runtime",
    "network",
    "coord",
    "security",
    "api",
    "utils",
    "incentive",
    "inference",
    "cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
authors = ["SynapseFlow Team"]
license = "MIT"
repository = "https://github.com/synapseflow/synapseflow"
readme = "README.md"
keywords = ["llm", "inference", "p2p", "distributed"]
categories = ["cryptography", "network-programming", "science::machine-learning"]
rust-version = "1.87"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.103"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
