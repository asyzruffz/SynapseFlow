[workspace]
resolver = "2"
members = [
    "cli",
    "domain",
    "node",
    "ports",
    "application",
    "adapters/in-memory",
    "adapters/local-cache",
    "adapters/llama-cpp",
    "tools/fixture-provisioner",
]
[workspace.package]
version = "0.2.0-dev"
edition = "2021"
authors = ["SynapseFlow Team"]
license = "MIT"
repository = "https://github.com/synapseflow/synapseflow"
readme = "README.md"
keywords = ["llm", "inference", "p2p", "distributed"]
categories = ["cryptography", "network-programming", "science::machine-learning"]
rust-version = "1.87"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.103"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
encoding_rs = "0.8.35"
llama-cpp-2 = "=0.1.154"
axum = { version = "0.8.9", features = ["json"] }
tokio-stream = "0.1.18"
uuid = { version = "1.22.0", features = ["v4"] }
tower = { version = "0.5.3", features = ["util"] }
