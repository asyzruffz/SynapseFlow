[workspace]
resolver = "2"
members = [
    "core",
    "runtime",
    "network",
    "coord",
    "security",
    "api",
    "utils",
    "incentive",
    "inference",
    "cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
authors = ["SynapseFlow Team"]
license = "MIT"
repository = "https://github.com/synapseflow/synapseflow"
readme = "README.md"
keywords = ["llm", "inference", "p2p", "distributed"]
categories = ["cryptography", "network-programming", "science::machine-learning"]
rust-version = "1.87"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52.3", features = ["full", "rt-multi-thread", "sync", "time", "macros"] }

# QUIC transport
#quinn = "0.11.9"

# P2P discovery
#libp2p = { version = "0.56.0", features = ["gossipsub", "kad", "dns", "quic", "identify", "ping", "relay", "autonat"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
#prost = "0.14.4"

# Crypto
#ring = "0.17.14"
#ed25519-dalek = "2.2.0"
#rsa = "0.9.10"

# Compression
#zstd = "0.13.3"
#snap = "1.1.1"

# Storage
#sled = "0.34.7"
#rocksdb = { version = "0.21", features = ["multi-threaded-cfg"] } # uncomment when needed

# Logging and metrics
#tracing = "0.1.44"
#tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
#prometheus = "0.14.0"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Utility crates
once_cell = "1.21.4"
hex = "0.4.3"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
