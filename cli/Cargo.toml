[package]
name = "synapseflow-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "SynapseFlow command-line client and node operator interface"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "synapseflow"
path = "src/main.rs"

[features]
default = []
runtime = ["synapseflow-node/runtime"]

[dependencies]
clap.workspace = true
serde_json.workspace = true
synapseflow-domain = { path = "../domain", version = "=0.2.0-dev" }
synapseflow-node = { path = "../node", version = "=0.2.0-dev", features = ["cli"] }

[lints]
workspace = true
