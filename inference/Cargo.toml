[package]
name = "synapseflow-inference"
version.workspace = true
edition.workspace = true
description = "Inference utilities: model loader, tokenizer and generation core"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true

# Candle and transformers crates used for model loading and inference
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"

# Tokenizer for handling tokenizer.json files
tokenizers = "0.15"

# Internal workspace crates
synapseflow-core = { path = "../core" }

[features]
# Keep default empty; enabling 'with-candle' will gate candle-transformers usage if needed
default = []
with-candle = []

[lints]
workspace = true
